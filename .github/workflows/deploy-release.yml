name: Deploy to Hf Hub

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "*.md"

  # to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: {}

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true
          ref: main

      - name: Install the Hugging Face CLI
        run: python3 -m pip install --upgrade "huggingface_hub>=1.0,<2"

      # Printed so that a permissions failure below is diagnosable from the log
      # alone: this shows which account the token resolves to and what it may do.
      - name: Check the token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf auth whoami

      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: lerobot/visualize_dataset
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # `hf` globs '*' across '/', so '.git*' covers .git/, .gitignore,
          # .gitattributes and .github/, and '*/.git*' covers nested copies.
          hf upload "$HF_REPO_ID" . . \
            --repo-type space \
            --exclude ".git*" \
            --exclude "*/.git*" \
            --commit-message "Sync $SOURCE_REPO@${SOURCE_SHA:0:7}"
