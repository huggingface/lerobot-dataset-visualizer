name: Desktop Build and Release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/local-and-hf-subdir-datasets]
    tags: ["v*"]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: linux
            files: |
              dist-electron/*.AppImage
              dist-electron/*.deb
          - name: Windows
            os: windows-latest
            artifact: windows
            files: dist-electron/*.exe
          - name: macOS
            os: macos-latest
            artifact: macos
            files: dist-electron/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate source
        run: bun run validate
      - name: Build desktop packages
        run: bun run desktop:dist:ci
      - name: Install Linux smoke-test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-test-packaged-app.mjs dist-electron/linux-unpacked/lerobot-dataset-visualizer --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: lerobot-dataset-visualizer-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
